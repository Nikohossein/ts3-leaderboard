<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>GameIzeh · TS3 Activity Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .leaderboard-container {
            max-width: 820px;
            width: 100%;
            background: #141a22;
            border-radius: 2.5rem;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(2px);
            border: 1px solid #2a3340;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #2b3442;
            padding-bottom: 0.9rem;
        }
        .header h1 {
            color: #f0f3fa;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            background: linear-gradient(145deg, #d4dfff, #a0b5e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .header h1 small {
            font-size: 0.95rem;
            background: #1f2a36;
            padding: 0.1rem 0.9rem;
            border-radius: 40px;
            color: #b2c9e8;
            -webkit-text-fill-color: #b2c9e8;
            background: #1f2a36;
            letter-spacing: 0.3px;
        }
        .timestamp {
            color: #8a9bb5;
            background: #1b232e;
            padding: 0.35rem 1.1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 400;
            border: 1px solid #2f3b4b;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .timestamp span {
            color: #c6d9f5;
            font-weight: 500;
        }
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .rank-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 1rem 0.5rem 0.9rem;
            background: #1a212b;
            border-radius: 60px;
            transition: background 0.2s, transform 0.1s;
            border: 1px solid #26303d;
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }
        .rank-item:hover {
            background: #1f2937;
            border-color: #3a4860;
        }
        .rank-number {
            font-weight: 700;
            font-size: 1.4rem;
            min-width: 3.2rem;
            text-align: center;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }
        .rank-username {
            flex: 1;
            color: #e9effa;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rank-time {
            font-weight: 500;
            font-size: 0.9rem;
            background: #0f1620;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            color: #bbd1f0;
            border: 1px solid #2f3d52;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .status-message {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #b6c9e5;
            background: #121a24;
            border-radius: 3rem;
            border: 1px dashed #3d4d66;
            margin: 0.5rem 0;
        }
        .status-message.error {
            border-color: #b3424a;
            background: #1e1926;
            color: #f2b5b5;
        }
        .footer-meta {
            margin-top: 1.8rem;
            display: flex;
            justify-content: flex-end;
            color: #4b5d78;
            font-size: 0.7rem;
            letter-spacing: 0.3px;
            border-top: 1px solid #1f2a36;
            padding-top: 0.9rem;
        }
        .footer-meta span {
            background: #111a23;
            padding: 0.2rem 1.2rem;
            border-radius: 30px;
        }
        /* responsive */
        @media (max-width: 600px) {
            .leaderboard-container { padding: 1.2rem 1rem; }
            .header h1 { font-size: 1.4rem; }
            .header h1 small { font-size: 0.7rem; padding: 0 0.7rem; }
            .timestamp { font-size: 0.65rem; padding: 0.2rem 0.9rem; }
            .rank-item { padding: 0.4rem 0.6rem 0.4rem 0.5rem; gap: 0.4rem; }
            .rank-number { font-size: 1.1rem; min-width: 2.5rem; }
            .rank-username { font-size: 0.9rem; }
            .rank-time { font-size: 0.7rem; padding: 0.15rem 0.7rem; }
        }
        @media (max-width: 430px) {
            .header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
        /* rainbow colors for ranks 4-50 will be applied via js */
        .gold { color: #f7d44a; text-shadow: 0 0 12px #f7b32b80; }
        .silver { color: #d0dbe8; text-shadow: 0 0 12px #b0c4de80; }
        .bronze { color: #d99b6c; text-shadow: 0 0 12px #b8733380; }
    </style>
</head>
<body>
    <div class="leaderboard-container" id="app">
        <div class="header">
            <h1>🏆 GameIzeh <small>activity</small></h1>
            <div class="timestamp" id="lastUpdate">⏱️ <span id="updateTime">—</span></div>
        </div>

        <div id="leaderboardList" class="leaderboard-list">
            <!-- dynamic content -->
            <div class="status-message">⏳ connecting to TeamSpeak …</div>
        </div>

        <div class="footer-meta">
            <span>⚡ top 50 · online activity</span>
        </div>
    </div>
    <script>
        (function() {
            // ---------- configuration ----------
            const TS3_IP = '5.57.32.182';
            const TS3_PORT = 2615;
            const TS3_SERVER_ID = 38722;
            const API_KEY = 'knEzayqRaw';
            const DOMAIN = 'GameIzeh.ir';
            const USERNAME = 'serveradmin';

            // HTTP endpoint (ServerQuery HTTP interface)
            const API_BASE = `http://${TS3_IP}:${TS3_PORT}/api/v1`;
            // we use the "clients" endpoint to get online clients with idleTime / connectionTime
            // for TS3 HTTP API: /server/{serverId}/clients
            const CLIENTS_URL = `${API_BASE}/server/${TS3_SERVER_ID}/clients`;

            // localStorage key for accumulating activity (per user)
            const STORAGE_KEY = 'ts3_activity_leaderboard';

            // ---------- state ----------
            let allUsers = [];               // array of { uid, username, totalSeconds }
            let updateTimer = null;

            // ---------- helpers ----------
            function formatDuration(seconds) {
                if (seconds < 60) return '< 1 min';
                const mins = Math.floor(seconds / 60);
                if (mins < 60) return `${mins}m`;
                const hrs = Math.floor(mins / 60);
                const remainMins = mins % 60;
                if (hrs < 24) return `${hrs}h ${remainMins}m`;
                const days = Math.floor(hrs / 24);
                const remainHrs = hrs % 24;
                return `${days}d ${remainHrs}h`;
            }

            // load persisted activity from localStorage
            function loadPersistedActivity() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return {};
                    const parsed = JSON.parse(raw);
                    // ensure it's an object with numeric values
                    if (typeof parsed === 'object' && parsed !== null) {
                        return parsed;
                    }
                    return {};
                } catch (_) {
                    return {};
                }
            }

            // save accumulated activity to localStorage
            function savePersistedActivity(activityMap) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(activityMap));
                } catch (_) { /* ignore */ }
            }

            // merge new online users with persisted data, update total activity
            function mergeActivity(onlineUsers) {
                // onlineUsers: array of { client_unique_identifier, nickname, connection_time? or idle? }
                // We use 'connection_time' (seconds since connect) if available, else fallback to idle?
                // Actually: TS3 HTTP API returns 'idle_time' (ms) and 'connection_time' (seconds) ?
                // Documentation: /clients returns: 'connection_time' in seconds? we will test.
                // We'll use 'connection_time' as online duration for this session.
                // If not present, we fallback to 0 (just to keep)
                const persisted = loadPersistedActivity();

                // Create a map from UID -> total seconds
                const activityMap = { ...persisted };

                const now = Date.now();
                // For each online user, we add their current connection_time (or 0)
                // but we need to accumulate. We'll simply add delta: 
                // we store last seen connection_time per user to avoid double counting?
                // Better: we store total accumulated seconds + last connection_time snapshot to add delta.
                // But we want to accumulate across sessions: we can just store total seconds, and each poll
                // we add the difference between current connection_time and previous connection_time.
                // However, if user reconnects, connection_time resets, but we want to keep accumulated total.
                // So we track total + last_connection_time per UID.
                // We'll store in localStorage: { uid: { total, lastSeenConnectionTime } }
                // But for simplicity we can store total only, and each poll we add current connection_time
                // but that would double count each poll. So we need delta.
                // Let's store a map: { uid: { total, lastConnectionTime } }

                // Since we want to keep it simple and robust: We'll store total seconds + lastPollConnectionTime
                // but we need to read the current connection_time from API.
                // We'll store as: { uid: { total, lastConnection } }

                let storedMap = {};
                try {
                    const raw = localStorage.getItem('ts3_activity_detailed');
                    if (raw) storedMap = JSON.parse(raw);
                } catch (_) { storedMap = {}; }

                // For each online user, update their total
                let changed = false;
                onlineUsers.forEach(user => {
                    const uid = user.client_unique_identifier || user.uid || user.clid || `unknown_${Math.random()}`;
                    // connection_time in seconds (from API)
                    let connectionTime = 0;
                    if (user.connection_time !== undefined && !isNaN(Number(user.connection_time))) {
                        connectionTime = Number(user.connection_time);
                    } else if (user.idle_time !== undefined) {
                        // idle_time is in ms, but connection_time is better; if missing, use 0
                    }
                    // ensure connectionTime is at least 0
                    connectionTime = Math.max(0, connectionTime);

                    const nickname = user.nickname || user.client_nickname || 'Unknown';

                    // Get stored data for this uid
                    const stored = storedMap[uid] || { total: 0, lastConnection: 0 };
                    let total = stored.total || 0;
                    const lastConn = stored.lastConnection || 0;

                    // If we have a previous connection_time, add delta (if current > last)
                    // But if current connection_time is less than last (reconnect), we still want to keep total
                    // and we just set lastConnection = current, but we don't add delta.
                    if (connectionTime > lastConn) {
                        const delta = connectionTime - lastConn;
                        total += delta;
                    } else {
                        // if reconnect or reset, we don't add delta, just update lastConnection
                        // but we might want to add something? no, we keep total as is.
                    }
                    // update lastConnection to current connection_time
                    storedMap[uid] = {
                        total: total,
                        lastConnection: connectionTime,
                        username: nickname
                    };
                    changed = true;
                });

                // Additionally, we remove users that are not online? No, we keep them in storedMap for persistence
                // but we only show top 50 from online + accumulated. We'll filter online later.

                if (changed) {
                    try {
                        localStorage.setItem('ts3_activity_detailed', JSON.stringify(storedMap));
                    } catch (_) { /* ignore */ }
                }

                // Build full user list from storedMap + online list (to show only online? but we want to show top 50 
                // based on total activity, even if they are offline? The requirement: "Show exactly 50 users ranked" 
                // and "Display only users who have been active for at least 1 minute". But we track offline too?
                // The spec: "Track and display how long each user has been active/online" and "Store/accumulate activity 
                // time across sessions using localStorage so users who disconnect don't lose their tracked time"
                // So we should display users based on total activity, even if they are offline? 
                // But the leaderboard should show "activity time" - likely we want to show all users with accumulated time.
                // However the spec says "Display only users who have been active for at least 1 minute" — likely means 
                // display users that have at least 1 minute of activity (either online or total).
                // We'll show all users from storedMap that have total >= 60 seconds, sorted desc.

                // Build array from storedMap
                const userList = [];
                for (const uid in storedMap) {
                    const entry = storedMap[uid];
                    if (entry.total >= 60) { // at least 1 minute
                        userList.push({
                            uid: uid,
                            username: entry.username || 'Unknown',
                            totalSeconds: Math.floor(entry.total)
                        });
                    }
                }

                // sort descending by totalSeconds
                userList.sort((a, b) => b.totalSeconds - a.totalSeconds);

                // keep top 50
                const top50 = userList.slice(0, 50);
                return top50;
            }

            // fetch online clients from TS3 HTTP API
            async function fetchClients() {
                const url = CLIENTS_URL;
                // Basic auth using username:apikey? or api key as header?
                // The documentation: use api-key header or basic auth.
                const headers = {
                    'Authorization': `Basic ${btoa(USERNAME + ':' + API_KEY)}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                };

                const response = await fetch(url, { method: 'GET', headers });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                // data should be an array of clients
                if (!Array.isArray(data)) {
                    throw new Error('Unexpected response format');
                }
                return data;
            }

            // update the leaderboard UI
            function renderLeaderboard(users) {
                const container = document.getElementById('leaderboardList');
                if (!users || users.length === 0) {
                    container.innerHTML = `<div class="status-message">👤 No active users with 1+ min activity yet</div>`;
                    return;
                }

                let html = '';
                const total = users.length;
                for (let i = 0; i < Math.min(total, 50); i++) {
                    const user = users[i];
                    const rank = i + 1;
                    let rankClass = '';
                    let rankColor = '';
                    if (rank === 1) rankClass = 'gold';
                    else if (rank === 2) rankClass = 'silver';
                    else if (rank === 3) rankClass = 'bronze';
                    else {
                        // rainbow gradient: from 4 to 50
                        const hue = ((rank - 4) / 46) * 360; // 0-360
                        rankColor = `hsl(${hue}, 85%, 65%)`;
                    }

                    const timeStr = formatDuration(user.totalSeconds);
                    const username = user.username || 'Unknown';
                    const rankDisplay = rank <= 3 ? `${rank}` : `${rank}`;

                    html += `
                        <div class="rank-item">
                            <div class="rank-number ${rankClass}" style="${rank > 3 ? `color: ${rankColor}; text-shadow: 0 0 12px ${rankColor}60;` : ''}">
                                ${rankDisplay}
                            </div>
                            <div class="rank-username">${username}</div>
                            <div class="rank-time">${timeStr}</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            }

            // main update: fetch, merge, render, update timestamp
            async function refreshLeaderboard() {
                const timeElement = document.getElementById('updateTime');
                const container = document.getElementById('leaderboardList');

                try {
                    // show loading state
                    container.innerHTML = `<div class="status-message">⏳ fetching live data …</div>`;

                    const clients = await fetchClients();
                    // filter out query clients? we keep all.
                    // merge with stored activity
                    const rankedUsers = mergeActivity(clients);

                    renderLeaderboard(rankedUsers);

                    // update timestamp
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    timeElement.textContent = timeStr;

                } catch (err) {
                    console.warn('TS3 fetch error:', err);
                    // show error and keep previous data if any? we try to show last known data.
                    // but we can show error message
                    const errorMsg = err.message || 'Could not connect to TeamSpeak API';
                    container.innerHTML = `<div class="status-message error">⚠️ ${errorMsg}</div>`;
                    // keep timestamp? still update
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    timeElement.textContent = timeStr + ' (error)';
                }
            }

            // initial load and schedule every 5 minutes
            function init() {
                refreshLeaderboard();
                if (updateTimer) clearInterval(updateTimer);
                updateTimer = setInterval(refreshLeaderboard, 5 * 60 * 1000); // 5 minutes
            }

            // let's go
            init();
        })();
    </script>
</body>
</html>
