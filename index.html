<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2Ray Config Finder</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;padding:20px;}
  .container{max-width:950px;margin:0 auto;}
  .card{background:#1e293b;border-radius:16px;padding:24px;border:1px solid #334155;}
  h1{text-align:center;font-size:24px;margin-bottom:4px;color:#22c55e;}
  .sub{text-align:center;color:#94a3b8;margin-bottom:20px;font-size:14px;}
  .btn-group{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-group button{flex:1;min-width:150px;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:0.2s;}
  .btn-primary{background:#22c55e;color:#0f172a;}
  .btn-primary:hover{background:#16a34a;}
  .btn-download{background:#3b82f6;color:#fff;}
  .btn-download:hover{background:#2563eb;}
  .btn-danger{background:#ef4444;color:#fff;}
  .btn-danger:hover{background:#dc2626;}
  button:disabled{opacity:0.5;cursor:wait;}
  #result{margin-top:16px;}
  .loader{text-align:center;color:#94a3b8;padding:30px 0;}
  .error{text-align:center;color:#f87171;padding:20px 0;background:#1e293b;border-radius:10px;}
  .config-item{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px;margin-bottom:12px;}
  .cfg-text{background:#0f172a;padding:10px;border-radius:6px;font-family:monospace;font-size:11px;word-break:break-all;border:1px solid #1e293b;direction:ltr;text-align:left;max-height:80px;overflow-y:auto;}
  .copy-btn{background:#3b82f6;color:white;border:none;border-radius:6px;padding:6px 16px;cursor:pointer;font-size:12px;margin-top:8px;}
  .copy-btn:hover{background:#2563eb;}
  .count-badge{background:#1e293b;padding:8px 16px;border-radius:999px;color:#60a5fa;text-align:center;margin-bottom:16px;font-size:14px;}
  .log-box{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px;margin-top:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow-y:auto;direction:ltr;text-align:left;}
  .tag{display:inline-block;background:#1e293b;padding:2px 10px;border-radius:999px;color:#60a5fa;font-size:12px;margin:2px;}
  .progress{width:100%;height:4px;background:#1e293b;border-radius:2px;margin:10px 0;overflow:hidden;}
  .progress-bar{height:100%;background:#22c55e;width:0%;transition:width 0.3s;border-radius:2px;}
  .source-count{color:#94a3b8;font-size:12px;text-align:center;margin-top:5px;}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🔍 V2Ray Config Finder</h1>
    <p class="sub">همه کانفیگ‌ها رو دریافت کن و دانلود کن</p>
    
    <div class="btn-group">
      <button class="btn-primary" onclick="getConfigs()">🚀 دریافت کانفیگ‌ها</button>
      <button class="btn-download" onclick="downloadTxt()">📥 دانلود TXT</button>
      <button class="btn-danger" onclick="clearAll()">🗑️ پاک کردن</button>
    </div>
    
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div id="result"></div>
    <div id="log" class="log-box">⏳ آماده...</div>
    <div class="source-count" id="sourceCount"></div>
  </div>
</div>

<script>
let allConfigs = [];
let totalSources = 0;

function log(msg) {
  const logDiv = document.getElementById('log');
  logDiv.textContent += '\n' + new Date().toLocaleTimeString() + ' - ' + msg;
  logDiv.scrollTop = logDiv.scrollHeight;
}

function updateProgress(pct) {
  document.getElementById('progressBar').style.width = pct + '%';
}

function clearAll() {
  allConfigs = [];
  document.getElementById('result').innerHTML = '';
  document.getElementById('log').textContent = '⏳ پاک شد...';
  document.getElementById('sourceCount').textContent = '';
  updateProgress(0);
  log('🗑️ همه چیز پاک شد');
}

// ===== همه لینک‌ها =====
function getSources() {
  return [
    "https://raw.githubusercontent.com/MahanKenway/Freedom-V2Ray/main/configs/vless.txt",
    "https://raw.githubusercontent.com/MahanKenway/Freedom-V2Ray/main/configs/mix.txt",
    "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/v2ray.txt",
    "https://raw.githubusercontent.com/nikita29a/FreeProxyList/main/mirror/1.txt",
    "https://raw.githubusercontent.com/bia-pain-bache/BPB-Worker-Panel/main/sub/vless.txt",
    "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt",
    "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt",
    "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vmess.txt",
    "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/trojan.txt",
    "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/ss.txt",
    "https://github.com/Epodonios/v2ray-configs/raw/main/All_Configs_Sub.txt",
    "https://raw.githubusercontent.com/V2RayRoot/V2RayConfig/refs/heads/main/Config/vless.txt",
    "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/1.txt",
    "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/2.txt",
    "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/3.txt",
    "https://raw.githubusercontent.com/Surfboardv2ray/v2ray-worker-sub/refs/heads/master/sub",
    "https://raw.githubusercontent.com/Surfboardv2ray/v2ray-worker-sub/refs/heads/master/Eternity.txt",
    "https://raw.githubusercontent.com/ArGo75/V2ray-Configs01/main/All_Configs_Sub.txt",
    "https://raw.githubusercontent.com/nikita29a/FreeProxyList/main/mirror/2.txt",
    "https://raw.githubusercontent.com/nikita29a/FreeProxyList/main/mirror/3.txt",
    "https://raw.githubusercontent.com/nikita29a/FreeProxyList/main/mirror/4.txt",
    "https://raw.githubusercontent.com/nikita29a/FreeProxyList/main/mirror/5.txt",
    "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/all.txt",
    "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/vless.txt",
    "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/vmess.txt",
    "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/trojan.txt",
    "https://raw.githubusercontent.com/ShatakVPN/ConfigForge-V2Ray/main/configs/light.txt",
    "https://raw.githubusercontent.com/clashv2ray-hub/v2rayfree/refs/heads/main/v2ray.txt",
    "https://raw.githubusercontent.com/yitong2333/proxy-minging/refs/heads/main/v2ray.txt",
    "https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY_RAW.txt"
  ];
}

// ===== دریافت با پروکسی =====
async function fetchWithProxy(url) {
  const proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://cors-anywhere.herokuapp.com/'
  ];
  
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy + encodeURIComponent(url), {
        headers: { 'User-Agent': 'Mozilla/5.0' }
      });
      if (res.ok) {
        const text = await res.text();
        if (text && text.length > 10) {
          return text;
        }
      }
    } catch (e) {}
  }
  
  throw new Error('همه پروکسی‌ها ناموفق بودن');
}

async function getConfigs() {
  const btn = document.querySelector('.btn-primary');
  btn.disabled = true;
  btn.textContent = '⏳ در حال دریافت...';
  updateProgress(5);
  
  document.getElementById('result').innerHTML = '<div class="loader">⏳ در حال دریافت کانفیگ‌ها...</div>';
  log('🚀 شروع دریافت...');
  
  const sources = getSources();
  totalSources = sources.length;
  document.getElementById('sourceCount').textContent = '📡 تعداد منابع: ' + totalSources;
  
  const all = [];
  let completed = 0;
  
  for (const url of sources) {
    try {
      const name = url.split('/').pop() || url.split('/').slice(-2).join('/');
      log('📡 دریافت از: ' + name);
      const text = await fetchWithProxy(url);
      
      if (text && text.length > 50) {
        const vless = text.match(/vless:\/\/[A-Za-z0-9+\/=@?&:%._~-]+/gi) || [];
        const vmess = text.match(/vmess:\/\/[A-Za-z0-9+\/=]+/gi) || [];
        const trojan = text.match(/trojan:\/\/[A-Za-z0-9+\/=@?&:%._~-]+/gi) || [];
        const ss = text.match(/ss:\/\/[A-Za-z0-9+\/=@?&:%._~-]+/gi) || [];
        
        const count = vless.length + vmess.length + trojan.length + ss.length;
        log('✅ ' + count + ' کانفیگ از ' + name);
        
        [...vless, ...vmess, ...trojan, ...ss].forEach(cfg => {
          let protocol = 'unknown';
          if (cfg.startsWith('vless')) protocol = 'vless';
          else if (cfg.startsWith('vmess')) protocol = 'vmess';
          else if (cfg.startsWith('trojan')) protocol = 'trojan';
          else if (cfg.startsWith('ss')) protocol = 'ss';
          
          const hostMatch = cfg.match(/@([^:]+):/);
          const portMatch = cfg.match(/:(\d+)(?:\?|$|#)/);
          
          all.push({
            protocol: protocol,
            config: cfg,
            host: hostMatch ? hostMatch[1] : 'unknown',
            port: portMatch ? portMatch[1] : 'unknown'
          });
        });
      } else {
        log('⚠️ محتوای خالی از ' + name);
      }
    } catch (e) {
      const name = url.split('/').pop() || url;
      log('❌ خطا در ' + name + ': ' + e.message);
    }
    completed++;
    updateProgress(5 + (completed / sources.length) * 85);
  }
  
  // حذف تکراری
  const unique = [];
  const seen = new Set();
  for (const cfg of all) {
    if (!seen.has(cfg.config)) {
      seen.add(cfg.config);
      unique.push(cfg);
    }
  }
  
  allConfigs = unique;
  updateProgress(100);
  
  if (unique.length === 0) {
    document.getElementById('result').innerHTML = '<div class="error">❌ هیچ کانفیگی پیدا نشد! لطفاً دوباره تلاش کنید.</div>';
    log('❌ هیچ کانفیگی پیدا نشد');
  } else {
    renderConfigs(unique);
    log('✅ ' + unique.length + ' کانفیگ دریافت شد');
    document.getElementById('sourceCount').textContent = '📡 تعداد منابع: ' + totalSources + ' | ✅ کانفیگ‌ها: ' + unique.length;
  }
  
  btn.disabled = false;
  btn.textContent = '🚀 دریافت کانفیگ‌ها';
}

function renderConfigs(configs) {
  const resultDiv = document.getElementById('result');
  
  if (!configs || configs.length === 0) {
    resultDiv.innerHTML = '<div class="error">❌ هیچ کانفیگی پیدا نشد</div>';
    return;
  }
  
  let html = '<div class="count-badge">✅ ' + configs.length + ' کانفیگ پیدا شد</div>';
  
  configs.slice(0, 30).forEach((cfg, i) => {
    html += `
      <div class="config-item">
        <div>
          <span class="tag">#${i+1}</span>
          <span class="tag">${cfg.protocol}</span>
          <span class="tag">${cfg.host}:${cfg.port}</span>
        </div>
        <div class="cfg-text">${cfg.config}</div>
        <button class="copy-btn" onclick="copyText('${cfg.config.replace(/'/g, "\\'")}')">📋 کپی</button>
      </div>
    `;
  });
  
  if (configs.length > 30) {
    html += '<div style="text-align:center;color:#94a3b8;padding:10px;">... و ' + (configs.length - 30) + ' تا دیگر</div>';
  }
  
  resultDiv.innerHTML = html;
}

// ===== دانلود فایل TXT =====
function downloadTxt() {
  if (allConfigs.length === 0) {
    alert('❌ اول دکمه "دریافت کانفیگ‌ها" را بزنید!');
    return;
  }
  
  log('📥 شروع دانلود...');
  
  let content = '# ============================================================\n';
  content += '# V2Ray Configs - ' + new Date().toLocaleString('fa-IR') + '\n';
  content += '# تعداد کل: ' + allConfigs.length + '\n';
  content += '# تعداد منابع: ' + totalSources + '\n';
  content += '# ============================================================\n\n';
  
  const grouped = {};
  allConfigs.forEach(cfg => {
    if (!grouped[cfg.protocol]) grouped[cfg.protocol] = [];
    grouped[cfg.protocol].push(cfg.config);
  });
  
  for (const [protocol, configs] of Object.entries(grouped)) {
    content += '# ===== ' + protocol.toUpperCase() + ' (' + configs.length + ') =====\n';
    configs.forEach(cfg => {
      content += cfg + '\n';
    });
    content += '\n';
  }
  
  content += '# ============================================================\n';
  content += '# پایان فایل\n';
  
  try {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'v2ray_configs_' + new Date().toISOString().slice(0,10) + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    log('✅ دانلود شد: ' + allConfigs.length + ' کانفیگ');
  } catch (e) {
    log('❌ خطا در دانلود: ' + e.message);
    alert('❌ خطا در دانلود: ' + e.message);
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ کپی شد!');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert('✅ کپی شد!');
  });
}

log('✅ آماده! روی دکمه دریافت کلیک کن');
document.getElementById('sourceCount').textContent = '📡 تعداد منابع: ' + getSources().length;
</script>
</body>
</html>
